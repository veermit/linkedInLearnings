name: Build Windows exe

on:
  workflow_dispatch:        # run manually: Actions tab > Build Windows exe > Run workflow
  push:
    tags: ["v*"]            # also builds + publishes a Release when you push a tag like v1.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name LinkedInLearningDownloader
          --collect-all yt_dlp --collect-all browser_cookie3 llcd_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: LinkedInLearningDownloader-windows
          path: dist/LinkedInLearningDownloader.exe
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LinkedInLearningDownloader.exe
